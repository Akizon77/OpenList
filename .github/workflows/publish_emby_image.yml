name: Publish Emby Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (like v4.2.6). Also pushes a "latest" tag.'
        required: true
        type: string
      frontend_tag:
        description: 'Frontend dist tag (like v4.2.6). Defaults to the latest OpenList-Frontend release.'
        required: false
        default: ''
        type: string

permissions:
  packages: write

env:
  GHCR_ORG_NAME: akizon77
  IMAGE_NAME: openlist-git
  REGISTRY: ghcr.io
  PLATFORMS: 'linux/amd64'
  FRONTEND_REPO: ${{ vars.FRONTEND_REPO || 'OpenListTeam/OpenList-Frontend' }}

jobs:
  release_docker:
    name: Build and publish Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: Fetch frontend dist
        id: fetch-frontend
        run: |
          set -eu
          if [ -n "${{ github.event.inputs.frontend_tag }}" ]; then
            tag="${{ github.event.inputs.frontend_tag }}"
          else
            tag="$(curl -fsSL -H 'Accept: application/vnd.github.v3+json' "https://api.github.com/repos/${{ env.FRONTEND_REPO }}/releases/latest" | grep '"tag_name"' | head -n 1 | cut -d'"' -f4)"
          fi
          if [ -z "$tag" ]; then
            echo "error: failed to resolve frontend tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "fetching frontend dist $tag from ${{ env.FRONTEND_REPO }}"
          asset_url="$(curl -fsSL -H 'Accept: application/vnd.github.v3+json' "https://api.github.com/repos/${{ env.FRONTEND_REPO }}/releases/tags/$tag" | jq -r '.assets[].browser_download_url' | grep 'openlist-frontend-dist' | grep -v 'lite' | grep '\.tar\.gz$' | head -n 1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = 'null' ]; then
            echo "error: frontend dist asset not found for tag $tag" >&2
            exit 1
          fi
          curl -fsSL "$asset_url" -o dist.tar.gz
          rm -rf public/dist && mkdir -p public/dist
          tar -xzf dist.tar.gz -C public/dist
          rm -f dist.tar.gz
          echo "frontend version: $(cat public/dist/VERSION)"

      - name: Build go binary (linux/amd64)
        run: |
          set -eu
          built_at="$(date +'%F %T %z')"
          git_commit="$(git log --pretty=format:%h -1)"
          version="${{ github.event.inputs.tag }}"
          web_version="${{ steps.fetch-frontend.outputs.tag }}"
          ldflags="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$version' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=$web_version'"
          mkdir -p build/linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/linux/amd64/openlist -ldflags="$ldflags" -tags=jsoniter .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_ORG_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.ci
          push: true
          build-args: |
            BASE_IMAGE_TAG=base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}