name: Publish Akizon77 Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (like v4.2.6). Also pushes a "latest" tag.'
        required: true
        type: string
      frontend_ref:
        description: 'Frontend git ref. Defaults to main.'
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_ORG_NAME: akizon77
  IMAGE_NAME: openlist
  REGISTRY: ghcr.io
  PLATFORMS: 'linux/amd64'
  FRONTEND_REPO: Akizon77/OpenList-Frontend
  FRONTEND_REF: ${{ github.event.inputs.frontend_ref || 'main' }}

jobs:
  release_docker:
    name: Build and publish Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend
          fetch-depth: 1

      - name: Resolve build metadata
        id: build-meta
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="main-${GITHUB_SHA::7}"
          fi
          if [ -z "$tag" ]; then
            echo "error: version tag is empty" >&2
            exit 1
          fi
          frontend_commit="$(git -C frontend rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "web_version=main-${frontend_commit}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          set -eu
          pnpm install --frozen-lockfile
          node ./scripts/i18n.mjs
          pnpm build
          printf '%s' "${{ steps.build-meta.outputs.web_version }}" > dist/VERSION

      - name: Prepare embedded frontend
        run: |
          set -eu
          rm -rf public/dist
          mkdir -p public/dist
          cp -a frontend/dist/. public/dist/
          test -f public/dist/index.html
          echo "frontend version: $(cat public/dist/VERSION)"

      - name: Build go binary (linux/amd64)
        run: |
          set -eu
          built_at="$(date +'%F %T %z')"
          git_commit="$(git log --pretty=format:%h -1)"
          version="${{ steps.build-meta.outputs.tag }}"
          web_version="${{ steps.build-meta.outputs.web_version }}"
          ldflags="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$version' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=$web_version'"
          mkdir -p build/linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/linux/amd64/openlist -ldflags="$ldflags" -tags=jsoniter .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_ORG_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.build-meta.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.ci
          push: true
          build-args: |
            BASE_IMAGE_TAG=base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
